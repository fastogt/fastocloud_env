# Goes in /etc/nginx/conf.d/. lua_shared_dict and init_by_lua_block are
# http-context directives: inside a server block nginx rejects them, and
# declared per-vhost they collide. Requires libnginx-mod-http-lua.

lua_shared_dict touched_files 10m;

init_by_lua_block {
  function extract_stream_id(uri)
    return string.match(uri, "^/([^/]+)/")
  end
}
